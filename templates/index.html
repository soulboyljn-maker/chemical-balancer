<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chemical equation balancer</title>
<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #eef2ff, #f8fafc);
    display: flex;
    justify-content: center;
    align-items: center;
    color: #1e293b;
}

.container {
    width: min(760px, 92%);
    background: white;
    padding: 40px;
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.12);
}

h1 {
    text-align: center;
    margin: 0;
    font-size: 32px;
}

.subtitle {
    text-align: center;
    color: #64748b;
    margin: 10px 0 35px;
}

label {
    display: block;
    font-weight: bold;
    margin-bottom: 10px;
}

.input-area {
    display: flex;
    gap: 10px;
}

input {
    flex: 1;
    height: 52px;
    padding: 0 16px;
    border: 1px solid #cbd5e1;
    border-radius: 10px;
    font-size: 16px;
    outline: none;
}

input:focus {
    border-color: #6366f1;
    box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
}

button {
    height: 52px;
    padding: 0 24px;
    border: none;
    border-radius: 10px;
    background: #4f46e5;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #4338ca;
}

.examples {
    margin-top: 14px;
    color: #64748b;
    font-size: 14px;
    line-height: 1.8;
}

.result {
    margin-top: 30px;
    padding: 24px;
    background: #f1f5f9;
    border-radius: 12px;
}

.result-title {
    font-weight: bold;
    margin-bottom: 12px;
}

.equation {
    font-size: 24px;
    font-weight: bold;
    text-align: center;
    word-break: break-word;
    padding: 10px;
}

.error {
    margin-top: 25px;
    padding: 15px;
    border-radius: 10px;
    background: #fef2f2;
    color: #b91c1c;
}

.footer {
    margin-top: 30px;
    text-align: center;
    color: #94a3b8;
    font-size: 13px;
}

@media (max-width: 600px) {
    .container {
        padding: 25px;
    }

    h1 {
        font-size: 26px;
    }

    .input-area {
        flex-direction: column;
    }

    button {
        width: 100%;
    }

    .equation {
        font-size: 19px;
    }
}
</style>
</head>
<body>
<div class="container">
    <h1>Chemical equation balancer</h1>
    <div class="subtitle">Automatically calculate the simplest integer coefficients based on linear algebra</div>
    <form method="POST">
        <label for="equation">Enter the chemical equation</label>
        <div class="input-area">
            <input
                id="equation"
                name="equation"
                type="text"
                value="{{ equation }}"
                placeholder="example:Fe + O2 = Fe2O3"
                autocomplete="off"
            >
            <button type="submit">balance</button>
        </div>
    </form>
    <div class="examples">
        example:<br>
        Fe + O2 = Fe2O3<br>
        Al + HCl = AlCl3 + H2<br>
        CuSO4·5H2O = CuSO4 + H2O
    </div>
    {% if result %}
    <div class="result">
        <div class="result-title">result</div>
        <div class="equation">{{ result }}</div>
    </div>
    {% endif %}
    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}
    <div class="footer">Chemical Equation Balancer</div>
</div>
</body>
</html>
